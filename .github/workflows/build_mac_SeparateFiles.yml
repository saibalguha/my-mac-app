name: Build macOS Application

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14  # macOS on Apple Silicon (M-series ARM64)
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build macOS App Bundle
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "MyPythonApp" main.py

      - name: Compress App Bundle for Download
        run: |
          cd dist
          zip -r MyPythonApp-macOS.zip MyPythonApp.app

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-App-Binary
          path: dist/MyPythonApp-macOS.zip
