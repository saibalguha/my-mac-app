name: Build macOS Application (.dmg)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14  # Apple Silicon (M-series ARM64)
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build macOS App Bundle
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "MyPythonApp" main.py

      - name: Install create-dmg utility
        run: brew install create-dmg

      - name: Package into .dmg Installer
        run: |
          create-dmg \
            --volname "MyPythonApp Installer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "MyPythonApp.app" 175 120 \
            --hide-extension "MyPythonApp.app" \
            --app-drop-link 425 120 \
            "dist/MyPythonApp.dmg" \
            "dist/MyPythonApp.app"

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-DMG-Installer
          path: dist/MyPythonApp.dmg